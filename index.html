*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(900px 500px at 50% -10%,#2a0a12,transparent 60%),#07060b;color:#EEE8F2;font:400 17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.box{width:100%;max-width:440px;text-align:center}

.sub{font-family:"VT323",monospace;font-size:22px;color:#3BE0CF;margin-bottom:4px}
.by{color:#A99FB6;font-size:15px;margin:0 0 22px}
form{display:grid;gap:10px;text-align:left;background:#14101b;border:1px solid #2d2538;border-radius:14px;padding:20px}
label{font-weight:700;font-size:15px}

input:focus{outline:2px solid #3BE0CF;border-color:transparent}
.rem{font-weight:400;display:flex;gap:8px;align-items:center;font-size:14.5px;color:#A99FB6}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;background:#E8232C;color:#fff;cursor:pointer;box-shadow:0 0 18px rgba(232,35,44,.45)}
button:disabled{opacity:.6}
.err{color:#FF5A5F;font-weight:700;min-height:1.3em;font-size:15px}
.small{color:#A99FB6;font-size:13.5px;margin-top:16px}

var K='starlight-cle';
function b64(s){ return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);}); }
function hex(u){ return Array.from(u,function(x){return x.toString(16).padStart(2,'0');}).join(''); }
function unhex(h){ return new Uint8Array(h.match(/../g).map(function(x){return parseInt(x,16);})); }
var er=document.getElementById('e'), btn=document.getElementById('b');
document.getElementById('sh').addEventListener('change',function(){ document.getElementById('p').type=this.checked?'text':'password'; });
function show(m){ er.textContent=m; btn.disabled=false; btn.textContent='Ouvrir le portail'; }
async function wrapKey(pwd){ var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),'PBKDF2',false,['deriveBits']); var kb=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,256)); var wk=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  for(var j=0;j<P.w.length;j++){ try{ var raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.w[j].i)},wk,b64(P.w[j].k))); return {raw:raw,prof:j===1}; }catch(e){} } return null; }
async function decrypt(raw){ var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']); return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d))); }
function mount(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var gs=document.getElementById('gate-style'); if(gs) gs.remove();
  document.title=doc.title||document.title;
  document.body.innerHTML=''; document.body.removeAttribute('style');
  function copy(src,dest){ Array.prototype.slice.call(src.childNodes).forEach(function(n){
    if(n.nodeName==='SCRIPT'){ var sc=document.createElement('script'); Array.prototype.forEach.call(n.attributes,function(a){ sc.setAttribute(a.name,a.value); }); sc.textContent=n.textContent; dest.appendChild(sc); }
    else if(n.nodeName!=='TITLE'){ dest.appendChild(document.importNode(n,true)); } }); }
  copy(doc.head,document.head); copy(doc.body,document.body);
  window.scrollTo(0,0);
}
async function unlock(raw){ var html; try{ html=await decrypt(raw); }catch(e){ return false; } try{ sessionStorage.setItem(K,hex(raw)); localStorage.setItem(K,hex(raw)); }catch(e){} mount(html); return true; }
if(!window.crypto||!crypto.subtle){ show('Ce navigateur ne peut pas ouvrir le jeu. Utilise Chrome, Edge, Firefox ou Safari à jour.'); return; }
(async function(){ var saved=null; try{ saved=sessionStorage.getItem(K)||localStorage.getItem(K); }catch(e){}
  if(saved){ try{ if(!(await unlock(unhex(saved)))){ try{ localStorage.removeItem(K); sessionStorage.removeItem(K); }catch(_){} } }catch(e){} } })();
document.getElementById('f').addEventListener('submit',async function(ev){ ev.preventDefault(); er.textContent=''; btn.disabled=true; btn.textContent='Ouverture…';
  try{ var r=await wrapKey(document.getElementById('p').value.split(' ').join('').trim().toUpperCase()); var ok=false;
    if(r){ if(r.prof){ try{ sessionStorage.setItem('hwk-prof','1'); }catch(e){} history.replaceState(null,'','#prof'); } ok=await unlock(r.raw); }
    if(!ok){ show('Mot de passe incorrect.'); var box=document.getElementById('box'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
  }catch(e){ show('Le jeu n’a pas pu s’ouvrir. Essaie avec Chrome ou Edge.'); }
});
